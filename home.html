<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>The Future of a Happy Couple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/home.css" />
</head>
<body>

<canvas id="snow-canvas"></canvas>
<div class="aurora"></div>

<div class="page">

  <header class="top-bar">
    <div class="brand">
      <span class="brand-icon">❄️</span>
      <span class="brand-name display">The Future of a Happy Couple</span>
    </div>
    <div class="user-chip">
      <span id="user-email">carregando...</span>
      <button class="logout-btn" id="logout-btn" title="Sair">
       <img src="img/sair.png" alt="Sair">
      </button>
    </div>
  </header>

  <section class="hero">
    <p class="eyebrow">Base Polar</p>
    <h1 class="display">Um pinguim e uma ursa polar, no mesmo iceberg.</h1>
    <p>Um site feito com carinho pra você minha princesa. Eu te amo! ❤</p>
  </section>

  <!-- CARTEIRA DE MOEDAS -->
  <section class="glass-card wallet-card">
    <div class="wallet-balance">
      <div class="coin-icon">
       <img src="img/moeda.png" alt="Moeda">
      </div>
      <div>
        <div class="amount"><span id="wallet-balance">0</span></div>
        <div class="label">moedas</div>
      </div>
    </div>
    <span class="streak-pill" id="wallet-streak">🔥 0 dias</span>
    <button class="claim-btn" id="claim-btn" disabled>Carregando...</button>
  </section>

  <!-- TERRITÓRIOS -->
  <section class="territories">

    <div class="glass-card territory-card">
      <div class="territory-head">
      <div class="territory-icon" data-territory="pinguim">
          <img id="territory-pinguim-img" src="profile\pinguim\default.jpg">
      </div>
        <div>
          <h3 class="territory-title display">Iceberg do Pinguim</h3>
          <p class="territory-sub">Alex on top, come on</p>
        </div>
      </div>
      <div class="photo-grid" id="grid-pinguim">
        <p class="photo-empty">Carregando...</p>
      </div>
      <button class="add-photo-btn" data-add-photo="pinguim">📷 Enviar foto</button>
    </div>

    <div class="glass-card territory-card">
      <div class="territory-head">
        <div class="territory-icon" data-territory="urso-polar">
      <img id="territory-urso-polar-img" src="profiles/ursinha/default2.jpg" alt="Ursinha">
        </div>
        <div>
          <h3 class="territory-title display">Toca da ursinha</h3>
          <p class="territory-sub">Seu cantinho</p>
        </div>
      </div>
      <div class="photo-grid" id="grid-urso-polar">
        <p class="photo-empty">Carregando...</p>
      </div>
      <button class="add-photo-btn" data-add-photo="urso-polar">📷 Enviar foto</button>
    </div>

  </section>

</div>

<!-- Navegação inferior (mobile) -->
<nav class="bottom-nav">
  <button class="active"><span class="nav-icon">🧊</span>Início</button>
  <button><span class="nav-icon">🖼️</span>Fotos</button>
  <button><span class="nav-icon">🪙</span>Moedas</button>
  <button><span class="nav-icon">⚙️</span>Perfil</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/snow.js"></script>
<script src="js/home.js"></script>
</body>
</html>
